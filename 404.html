<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Not found — Benjamin Pachter</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a0e14">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0e14'/%3E%3Ctext x='16' y='22' font-family='monospace' font-size='15' font-weight='700' fill='%232dd4bf' text-anchor='middle'%3EBP%3C/text%3E%3C/svg%3E">
<style>
  :root{--bg:#0a0e14;--text:#cdd8e4;--bright:#eef4fb;--accent:#2dd4bf;--muted:#8fa3b8;--line:#1e2a38}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:32px;
    background:var(--bg);color:var(--text);
    font-family:"Segoe UI",system-ui,-apple-system,sans-serif;
    background-image:linear-gradient(var(--line) 1px,transparent 1px),
                     linear-gradient(90deg,var(--line) 1px,transparent 1px);
    background-size:40px 40px}
  .card{max-width:560px;width:100%}
  .mark{width:64px;height:64px;border:2px solid var(--accent);border-radius:14px;
    display:grid;place-items:center;font:700 26px/1 ui-monospace,Consolas,monospace;
    color:var(--accent);background:#0f1620;margin-bottom:34px}
  h1{font-size:34px;line-height:1.15;margin:0 0 12px;color:var(--bright);font-weight:600}
  .code{font:600 13px/1 ui-monospace,Consolas,monospace;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:14px}
  p{margin:0 0 30px;color:var(--muted);font-size:16px;line-height:1.6}
  .links{display:flex;flex-wrap:wrap;gap:10px}
  a{display:inline-block;padding:9px 15px;border:1px solid var(--line);border-radius:999px;
    color:var(--text);text-decoration:none;font-size:14px;transition:border-color .18s,color .18s}
  a:hover,a:focus-visible{border-color:var(--accent);color:var(--bright)}
  a.primary{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:600}
  @media (prefers-reduced-motion:reduce){a{transition:none}}
</style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">BP</div>
    <div class="code">Error 404</div>
    <h1>This page doesn't exist.</h1>
    <p>The link may be out of date, or the address slightly off. Everything is one click away.</p>
    <div class="links">
      <a class="primary" href="/">Portfolio</a>
      <a href="/gradient/">Gradient</a>
      <a href="/entropy/">Entropy</a>
      <a href="/kernel/">Kernel</a>
      <a href="/attractor/">The Great Attractor</a>
      <a href="https://thessa.space">Thessa</a>
    </div>
  </main>
</body>
</html>
