<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Architecture Recon</title>
    <!-- This build is superseded by /atlas/, which is what the portfolio links.
         It stays served so that any link already pointing here keeps working,
         but the canonical tells search engines the two are one page so they are
         not indexed as duplicate content. -->
    <link rel="canonical" href="https://bpachter.github.io/atlas/" />
    <!-- Barlow served from this origin rather than fonts.googleapis.com — the
         Google stylesheet was render-blocking. See /atlas/index.html. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/barlow-latin-400.woff2">
    <style>
      @font-face{font-family:'Barlow';font-style:normal;font-weight:400;font-display:swap;
        src:url(/fonts/barlow-latin-400.woff2) format('woff2')}
      @font-face{font-family:'Barlow';font-style:normal;font-weight:500;font-display:swap;
        src:url(/fonts/barlow-latin-500.woff2) format('woff2')}
      @font-face{font-family:'Barlow';font-style:normal;font-weight:700;font-display:swap;
        src:url(/fonts/barlow-latin-700.woff2) format('woff2')}
      @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:400;font-display:swap;
        src:url(/fonts/barlow-condensed-latin-400.woff2) format('woff2')}
      @font-face{font-family:'Barlow Condensed';font-style:normal;font-weight:600;font-display:swap;
        src:url(/fonts/barlow-condensed-latin-600.woff2) format('woff2')}
    </style>
    <script type="module" crossorigin src="/astraea/assets/index-Bw4OplPt.js"></script>
    <link rel="stylesheet" crossorigin href="/astraea/assets/index-DN6rO98m.css">
  </head>
  <body>
    <!-- Back to the portfolio. Outside #root and inline-styled on purpose:
         Astraea is a React app, and a visitor who arrives from the portfolio
         should be able to leave without the browser's back button and without
         a working bundle. NOTE: this file is Vite build output — re-add this
         block to the astraea SOURCE index.html, or the next rebuild drops it
         again, which is exactly what happened once already. -->
    <a href="https://bpachter.github.io/" aria-label="Back to portfolio"
       style="position:fixed;top:14px;left:14px;z-index:9999;display:inline-flex;
              align-items:center;gap:7px;padding:7px 13px;border-radius:999px;
              font:500 12px/1 Barlow,system-ui,sans-serif;letter-spacing:.06em;
              text-transform:uppercase;text-decoration:none;color:#e8ecf1;
              background:rgba(14,17,22,.72);border:1px solid rgba(232,236,241,.22);
              backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)"
    >&#8592; Portfolio</a>
    <div id="root"></div>
  </body>
</html>
