<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Astraea Recon Viewer — moved to /atlas/</title>
    <meta name="robots" content="noindex">

    <!-- This path used to serve its own build of the recon viewer. That build was
         produced from a Git Bash shell, which rewrote Vite's base path: the emitted
         bundle asked for "/Program%20Files/Git/astraea/graphs/..." instead of
         "/astraea/graphs/...". Every data request 404'd and the page rendered
         "No graph instance found" to anyone who opened it.

         Rather than rebuild a second copy of an app that already lives at /atlas/,
         this path now redirects there. The app is identical — the two bundles
         differed by 44 bytes, all of it the base path — so nothing is lost, and
         any link already pointing here keeps working. -->
    <link rel="canonical" href="https://bpachter.github.io/atlas/">
    <meta http-equiv="refresh" content="0; url=/atlas/">
    <script>location.replace('/atlas/' + location.hash);</script>

    <style>
      :root{color-scheme:light dark;--bg:#f2f2f3;--fg:#0a0e14;--accent:#0f6b62}
      @media (prefers-color-scheme:dark){:root{--bg:#0a0e14;--fg:#e8eef4;--accent:#2dd4bf}}
      body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);
        color:var(--fg);font:400 16px/1.6 Barlow,system-ui,sans-serif;text-align:center;padding:24px}
      a{color:var(--accent)}
    </style>
  </head>
  <body>
    <!-- Only seen if both the script and the meta refresh are blocked. -->
    <p>The recon viewer lives at <a href="/atlas/">bpachter.github.io/atlas/</a>.</p>
  </body>
</html>
