     paint for a first-time visitor. The toggle rewrites these media queries
     when someone picks a theme by hand, so an explicit choice still wins. -->

<meta name="theme-color" content="#0a0e14" media="(prefers-color-scheme: dark)">
<!-- Runs before first paint so the page never flashes the wrong theme. A stored
     choice wins; with nothing stored the OS setting decides. Two try blocks,
     not one: localStorage throws outright in some privacy modes, and that must
     not take the media query down with it. -->
<script>(function(){var s=null;try{s=localStorage.getItem('bp-theme')}catch(e){}
try{if(s==='dark'||(!s&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.setAttribute('data-theme','dark')}catch(e){}})();</script>

<style>
  /* Industry — design-system tokens and component classes (subset used here) */
  :root{
    --color-bg:#f2f2f3;
    --color-surface:#e9e9ea;
    --color-text:#1d1f20;
    --color-accent:#5980a6;
    --color-accent-2:#728fab;
    --color-divider:color-mix(in srgb,#1d1f20 16%,transparent);
    /* Muted text scale. Every one of these paints small text, so each step has
       to clear 4.5:1 against --color-bg once its alpha composites — and light
       is the binding theme: #1d1f20 over #f2f2f3 does not clear until ~62%,
       where #cdd8e4 over #0a0e14 clears at ~54%. So each theme carries its own
       percentages, picked to land the same three steps (5.4 / 5.1 / 4.8) in
       both. Muted still reads muted; it just stops being unreadable. */
    --color-mute:color-mix(in srgb,var(--color-text) 68%,transparent);
    --color-mute-2:color-mix(in srgb,var(--color-text) 66%,transparent);
    --color-mute-3:color-mix(in srgb,var(--color-text) 64%,transparent);
    --color-accent-100:#eef6ff;
    --color-accent-200:#d6ebff;
    --color-accent-300:#b5d9fd;
    --color-accent-400:#94bce3;
    --color-accent-500:#749dc4;
    --color-accent-600:#597ea3;
    --color-accent-700:#416180;
    --color-accent-800:#2c455d;
    --color-accent-900:#1d2d3d;
    --font-heading:"Barlow Condensed",system-ui,sans-serif;
    --font-heading-weight:600;
    --font-body:"Barlow",system-ui,sans-serif;
    --shadow-sm:0 1px 2px color-mix(in srgb,#2b2b2d 14%,transparent);
    --shadow-md:0 3px 10px color-mix(in srgb,#2b2b2d 16%,transparent);
    --shadow-lg:0 12px 32px color-mix(in srgb,#2b2b2d 22%,transparent);
  }
  *,*::before,*::after{box-sizing:border-box}
  body{margin:0;font-family:var(--font-body);font-size:15px;line-height:1.55;font-weight:400;background:var(--color-bg);color:var(--color-text)}
  h1,h2,h3,h4,h5,h6{font-family:var(--font-heading);font-weight:var(--font-heading-weight);line-height:1.12;letter-spacing:-.015em;margin:0 0 7px}
  p{margin:0 0 10px}
  a{color:var(--color-accent);text-underline-offset:3px}
  img{display:block;max-width:100%}
  figure{margin:0}
  :focus{outline:none}
  :focus-visible{outline:2px solid var(--color-accent);outline-offset:2px}
  ::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}

  .blueprint{position:relative;border:1px solid var(--color-divider);border-radius:0}
  .blueprint>.corner{position:absolute;width:11px;height:11px;color:color-mix(in srgb,var(--color-text) 55%,transparent)}
  .blueprint>.corner::before,.blueprint>.corner::after{content:"";position:absolute;background:currentColor}
  .blueprint>.corner::before{left:5px;top:0;width:1px;height:100%}
  .blueprint>.corner::after{top:5px;left:0;width:100%;height:1px}
  .blueprint>.corner.tl{top:-6px;left:-6px}
  .blueprint>.corner.tr{top:-6px;right:-6px}
  .blueprint>.corner.bl{bottom:-6px;left:-6px}
  .blueprint>.corner.br{bottom:-6px;right:-6px}
</style>
<style>
  :root{ --ease-out:cubic-bezier(.16,1,.3,1); }
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--color-bg);color:var(--color-text);text-wrap:pretty}
  /* accent-700, not accent: raw accent text on --color-bg is 3.71:1 in light
     mode, under the 4.5:1 AA floor — the same lift index.html's CTA got. */
  .cs a{color:var(--color-accent-700);text-decoration:none}
  .cs ::selection{background:color-mix(in srgb,var(--color-accent) 30%,transparent)}
  .cs b{font-weight:700;color:var(--color-text)}
  .cs{position:relative;min-height:100vh}
  .wrap{max-width:1000px;margin:0 auto;padding:0 clamp(24px,4.4vw,56px)}
  .cs-top,.cs-body{position:relative;z-index:1}
  .cs-top{position:sticky;top:0;z-index:6;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:15px clamp(24px,4.4vw,56px);border-bottom:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-bg) 84%,transparent);backdrop-filter:blur(9px)}
  /* .cs .cs-back so it outranks the .cs a accent rule above */
  .cs .cs-back{font-family:var(--font-heading);font-weight:600;text-transform:uppercase;letter-spacing:.05em;font-size:14px;color:var(--color-text);display:inline-flex;align-items:center;gap:9px}
  .cs .cs-back:hover{color:var(--color-accent-700)}
  /* WCAG 2.5.8 wants a 24px target; .cs-back rendered 21.7px tall on a 375px
     viewport and the .go link 19.4px. Both are expanded with an absolutely
     positioned overlay, which grows the target without moving the layout. */
  .cs-back,.go{position:relative}
  .cs-back::after,.go::after{content:"";position:absolute;left:0;right:0;
    top:50%;height:24px;transform:translateY(-50%)}
  .theme-toggle{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--color-divider);background:transparent;color:var(--color-text);cursor:pointer;transition:border-color .18s,color .18s;flex:none}
  .theme-toggle:hover{border-color:var(--color-accent);color:var(--color-accent)}
  .theme-toggle svg{width:16px;height:16px;stroke-width:1.5}
  .theme-toggle .ic-sun{display:none}
  .cs-intro{padding:56px 0 12px}
  .kick{font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--color-accent-700)}
  .cs-title{font-family:var(--font-heading);font-weight:600;text-transform:uppercase;font-size:clamp(34px,5vw,60px);line-height:1.0;letter-spacing:.005em;margin:12px 0 0;color:var(--color-text)}
  .cs-lead{font-size:clamp(15px,1.6vw,18px);line-height:1.55;max-width:58ch;margin:20px 0 0;color:color-mix(in srgb,var(--color-text) 82%,transparent)}
  .cs-more{font-family:var(--font-heading);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:13px;color:var(--color-mute-3);border-top:1px solid var(--color-divider);margin-top:40px;padding:26px 0 64px}

  /* aurora — dark only */
  .cs-aurora{position:absolute;top:0;left:0;right:0;height:440px;overflow:hidden;pointer-events:none;display:none;z-index:0}
  [data-theme="dark"] .cs-aurora{display:block}
  .cs-aurora .blob{position:absolute;border-radius:50%;filter:blur(72px);opacity:.5;will-change:transform}
  .cs-aurora .b1{width:420px;height:360px;left:-6%;top:-34%;background:radial-gradient(circle,#2dd4bf,transparent 68%)}
  .cs-aurora .b2{width:460px;height:380px;right:-6%;top:-42%;background:radial-gradient(circle,#6d63f0,transparent 66%);opacity:.4}
  .cs-aurora .b3{width:360px;height:320px;left:42%;top:-26%;background:radial-gradient(circle,#38bdf8,transparent 70%);opacity:.3}

  /* case study — BMW reorder consolidation */
  /* The figures carry this page, so they get their own presence rather than
     sitting in a bare bordered box: a faint accent wash off two corners, and
     a border that warms on hover. Colour only — nothing here moves the text
     or changes a contrast ratio. */
  .bmw{position:relative;margin:38px 0 6px;padding:clamp(20px,2.8vw,34px);scroll-margin-top:88px;
    background:
      radial-gradient(115% 85% at 100% 0%,color-mix(in srgb,var(--color-accent) 7%,transparent),transparent 60%),
      radial-gradient(90% 70% at 0% 100%,color-mix(in srgb,var(--color-accent) 4%,transparent),transparent 55%);
    transition:border-color .28s var(--ease-out),box-shadow .28s var(--ease-out)}
  .bmw:hover{border-color:color-mix(in srgb,var(--color-accent) 42%,var(--color-divider))}
  [data-theme="dark"] .bmw{box-shadow:0 20px 54px -34px rgba(0,0,0,.92)}
  [data-theme="dark"] .bmw:hover{box-shadow:0 20px 54px -30px rgba(0,0,0,.95),
    0 0 0 1px color-mix(in srgb,var(--color-accent) 16%,transparent)}
  @media (prefers-reduced-motion:reduce){.bmw{transition:none}}
  /* the number lives large in the corner — it turns six figures into a
     numbered sequence you can navigate by eye */
  .bmw::after{content:attr(data-seq);position:absolute;top:clamp(14px,2vw,22px);right:clamp(16px,2.4vw,28px);
    font-family:var(--font-heading);font-weight:600;font-size:clamp(38px,5vw,64px);line-height:1;
    color:color-mix(in srgb,var(--color-accent) 13%,transparent);pointer-events:none;
    font-feature-settings:"tnum" 1;z-index:0}
  .bmw > *{position:relative;z-index:1}
  .bmw-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:0 0 26px}
  .bmw-title{font-family:var(--font-heading);font-weight:600;text-transform:uppercase;font-size:24px;letter-spacing:.01em;margin:5px 0 0;color:var(--color-text)}
  .bmw-seg{display:inline-flex;border:1px solid var(--color-divider)}
  .bmw-mode{font-family:var(--font-heading);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:12px;padding:8px 16px;background:transparent;color:var(--color-mute);border:0;cursor:pointer;transition:background .18s,color .18s}
  .bmw-mode + .bmw-mode{border-left:1px solid var(--color-divider)}
  /* accent-700 background: --color-bg text on raw accent is 3.71:1 (light),
     under AA; accent-700 lifts it to 5.78:1 and darkens dark mode too. */
  .bmw-mode[aria-pressed="true"]{background:var(--color-accent-700);color:var(--color-bg)}
  .ro-note{font-size:13px;line-height:1.62;color:color-mix(in srgb,var(--color-text) 80%,transparent);margin:18px 0 0}

  /* alt svg diagrams */
  .alt-svg{display:block;width:100%;height:auto;margin-top:10px}
  .alt-svg text{font-family:var(--font-body);fill:color-mix(in srgb,var(--color-text) 72%,transparent)}
  .alt-svg .svg-k{font-family:var(--font-heading);font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .alt-svg .mut{fill:var(--color-mute-2)}
  .alt-svg .acc{fill:var(--color-accent-700)}
  .alt-svg .tp{fill:var(--color-text)}
  .alt-svg .ink{stroke:color-mix(in srgb,var(--color-text) 65%,transparent);fill:none;stroke-width:1.5}
  .alt-svg .ln{stroke:var(--color-divider);stroke-width:1.4}
  /* strokes, not text — 3:1 is the bar (SC 1.4.11), but 45%/40% missed even
     that in light mode, so both step up to a percentage that clears it. */
  .alt-svg .dash{stroke:color-mix(in srgb,var(--color-text) 52%,transparent);stroke-dasharray:4 4;fill:none;stroke-width:1.4}
  .alt-svg .s-fill{fill:var(--color-accent);opacity:.85}
  .alt-svg .s-mr{fill:var(--color-accent-700);opacity:.9}
  .alt-svg .s-ro{fill:transparent;stroke:color-mix(in srgb,var(--color-text) 52%,transparent);stroke-dasharray:3 2;transition:fill .5s,stroke .5s}
  .bmw[data-mode="optimized"] .alt-svg .s-ro{fill:var(--color-accent);stroke:transparent}
  .alt-svg .ro-truck{opacity:0;transform:translateX(-26px);transition:opacity .5s var(--ease-out),transform .5s var(--ease-out)}
  .bmw[data-mode="optimized"] .alt-svg .ro-truck{opacity:1;transform:translateX(0)}
  .alt-svg .t-opt{display:none}
  .bmw[data-mode="optimized"] .alt-svg .t-legacy{display:none}
  .bmw[data-mode="optimized"] .alt-svg .t-opt{display:inline}
  /* 03 — regime MC lab */
  .mc-canvas{display:block;width:100%;height:468px;border:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-text) 2.5%,transparent)}
  .mc-ctrl{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin-top:14px}
  .mc-ctrl .fx-presets{flex:none;max-width:100%}
  .mc-lab{display:flex;align-items:center;gap:9px;font-family:var(--font-heading);font-weight:600;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-mute-2)}
  .mc-lab input{width:120px}
  .mc-lab b{font-size:13px;color:var(--color-text);font-feature-settings:"tnum" 1;min-width:34px}
  .mc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--color-divider);border:1px solid var(--color-divider);margin-top:14px}
  .mc-stat{background:var(--color-bg);padding:10px 12px}
  .mc-k{display:block;font-size:10px;letter-spacing:.07em;text-transform:uppercase;font-family:var(--font-heading);font-weight:600;color:var(--color-mute-3);margin-bottom:2px}
  .mc-v{font-family:var(--font-heading);font-weight:600;font-size:19px;letter-spacing:.01em;font-feature-settings:"tnum" 1;color:var(--color-text);white-space:nowrap}
  .fx-preset[aria-pressed="true"]{background:var(--color-accent);color:var(--color-bg)}
  @media (max-width:760px){.mc-canvas{height:360px}.mc-stats{grid-template-columns:repeat(2,1fr)}}
  .line-cars{animation:lineMove 7s linear infinite}
  @keyframes lineMove{from{transform:translateX(0)}to{transform:translateX(130px)}}
  @media (prefers-reduced-motion:reduce){.line-cars{animation:none}}

  /* 02 — NYMT factor model */
  .fx-stage{display:grid;grid-template-columns:1.55fr 1fr;gap:clamp(20px,3vw,44px);align-items:start}
  .fx-cols{display:grid;grid-template-columns:150px 1fr 36px 84px 42px;gap:12px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--font-heading);font-weight:600;color:var(--color-mute-3);padding-bottom:8px;border-bottom:1px solid var(--color-divider)}
  .fx-cols span:nth-child(3),.fx-cols span:nth-child(5){text-align:right}
  .fx-row{position:relative;display:grid;grid-template-columns:150px 1fr 36px 84px 42px;gap:12px;align-items:center;padding:11px 0 13px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent)}
  .fx-label{font-size:12px;letter-spacing:.03em;text-transform:uppercase;font-family:var(--font-heading);font-weight:600;color:color-mix(in srgb,var(--color-text) 72%,transparent)}
  .fx-vnum{font-family:var(--font-heading);font-weight:600;font-size:15px;font-feature-settings:"tnum" 1;text-align:right}
  .fx-wnum{font-size:11px;color:var(--color-mute-2);font-feature-settings:"tnum" 1;text-align:right}
  .fx-bar{position:absolute;left:0;right:0;bottom:-1px;height:2px;pointer-events:none}
  .fx-bar i{display:block;height:100%;background:var(--color-accent);width:0;transition:width .25s var(--ease-out)}
  /* 24px, not 22 — these twenty sliders are the whole interaction on this
     card, and two pixels is the difference between clearing WCAG 2.5.8 and
     missing it. The track and thumb stay centred, so nothing looks different. */
  input.fx-val,input.fx-wt{-webkit-appearance:none;appearance:none;height:24px;background:transparent;cursor:ew-resize;border:0;margin:0}
  .fx-row .fx-val,.fx-row .fx-wt{width:100%;min-width:0}
  input.fx-val::-webkit-slider-runnable-track,input.fx-wt::-webkit-slider-runnable-track{height:2px;background:var(--color-divider)}
  input.fx-val::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;margin-top:-5.5px;border-radius:0;background:var(--color-accent);border:1px solid var(--color-accent-700)}
  input.fx-wt::-webkit-slider-thumb{-webkit-appearance:none;width:10px;height:10px;margin-top:-4px;border-radius:0;background:var(--color-bg);border:1.5px solid var(--color-accent-700)}
  input.fx-wt:disabled{opacity:.35;cursor:default}
  input.fx-val::-moz-range-thumb{width:13px;height:13px;border-radius:0;background:var(--color-accent);border:1px solid var(--color-accent-700)}
  input.fx-wt::-moz-range-thumb{width:10px;height:10px;border-radius:0;background:var(--color-bg);border:1.5px solid var(--color-accent-700)}
  input.fx-val::-moz-range-track,input.fx-wt::-moz-range-track{height:2px;background:var(--color-divider)}
  input.fx-val:focus-visible,input.fx-wt:focus-visible{outline:2px solid var(--color-accent);outline-offset:4px}
  .fx-board{border:1px solid var(--color-divider);padding:22px;display:flex;flex-direction:column;gap:16px}
  .fx-score-row{display:flex;align-items:baseline;gap:10px}
  .fx-score{font-family:var(--font-heading);font-weight:600;font-size:62px;line-height:.9;letter-spacing:.01em;font-feature-settings:"tnum" 1;color:var(--color-text)}
  .fx-of{font-family:var(--font-heading);font-weight:600;font-size:16px;color:var(--color-mute-3)}
  .fx-verdict{margin-left:auto;font-family:var(--font-heading);font-weight:600;font-size:11px;letter-spacing:.09em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--color-divider);color:var(--color-mute);white-space:nowrap}
  .fx-verdict[data-v="Pursue"]{border-color:var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-800)}
  .fx-verdict[data-v="Watch list"]{border-color:var(--color-accent-700);color:var(--color-accent-700)}
  .fx-gauge{position:relative;height:7px;border:1px solid var(--color-divider)}
  .fx-gauge i{position:absolute;left:0;top:0;bottom:0;background:var(--color-accent);width:0;transition:width .3s var(--ease-out)}
  .fx-tick{position:absolute;top:-4px;bottom:-4px;width:1px;background:color-mix(in srgb,var(--color-text) 52%,transparent)}
  .fx-scale{display:flex;justify-content:space-between;font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--color-mute-3);font-feature-settings:"tnum" 1;margin-top:6px}
  .fx-presets{display:flex;flex-wrap:wrap;border:1px solid var(--color-divider)}
  .fx-preset{flex:1 1 auto;white-space:nowrap;font-family:var(--font-heading);font-weight:600;text-transform:uppercase;letter-spacing:.04em;font-size:11px;padding:8px 10px;background:transparent;color:var(--color-mute);border:0;cursor:pointer;transition:background .18s,color .18s}
  .fx-preset + .fx-preset{border-left:1px solid var(--color-divider)}
  .fx-preset:hover{background:color-mix(in srgb,var(--color-accent) 10%,transparent);color:var(--color-accent-700)}
  .fx-wmode[aria-pressed="true"]{background:var(--color-accent);color:var(--color-bg)}
  .fx-cap{display:block;font-family:var(--font-heading);font-weight:600;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--color-mute-3);margin-bottom:6px}
  .fx-hint{font-size:11.5px;line-height:1.55;color:var(--color-mute-2);margin:0}
  @media (max-width:760px){.fx-stage{grid-template-columns:1fr}.fx-cols,.fx-row{grid-template-columns:104px 1fr 32px 60px 36px;gap:8px}}
  @media (max-width:430px){.fx-cols,.fx-row{grid-template-columns:82px 1fr 26px 46px 30px;gap:6px}.fx-label{font-size:10.5px}}
  .fx-map{position:relative;z-index:0;height:320px;border:1px solid var(--color-divider);margin-bottom:26px;background:var(--color-surface);font-family:var(--font-body)}
  .fx-map-tag{position:absolute;top:10px;left:10px;z-index:500;font-family:var(--font-heading);font-weight:600;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;background:var(--color-bg);border:1px solid var(--color-divider);color:var(--color-mute);pointer-events:none}
  .fx-pin{position:relative;display:block;width:12px;height:12px;box-sizing:border-box;border:1.5px solid var(--color-accent-700);background:var(--color-bg)}
  /* The pins are 16px icons Leaflet positions absolutely from their anchor, so
     the target is expanded on the inner span: touching the wrapper would move
     the pin off the coordinate it is marking. */
  .fx-pin::after{content:"";position:absolute;top:50%;left:50%;width:24px;height:24px;transform:translate(-50%,-50%)}
  .fx-pin--subject{width:16px;height:16px;background:var(--color-accent);border:1px solid var(--color-accent-700);box-shadow:0 0 0 5px color-mix(in srgb,var(--color-accent) 22%,transparent)}
  .fx-tip{background:var(--color-bg);border:1px solid var(--color-divider);border-radius:0;color:var(--color-text);font-family:var(--font-body);font-size:11.5px;box-shadow:var(--shadow-sm);padding:5px 9px}
  .fx-tip::before{display:none}
  .fx-map .leaflet-control-attribution{background:color-mix(in srgb,var(--color-bg) 80%,transparent);color:var(--color-mute);font-size:9px}
  .fx-map .leaflet-control-attribution a{color:inherit}
  .fx-card{position:absolute;left:12px;bottom:12px;z-index:500;display:flex;gap:10px;align-items:stretch;background:var(--color-bg);border:1px solid var(--color-divider);padding:7px;box-shadow:var(--shadow-md);max-width:300px}
  .fx-card-img{width:96px;height:72px;flex:none;display:flex;align-items:center;justify-content:center;border:1px solid var(--color-divider);background:color-mix(in srgb,var(--color-accent) 8%,transparent);color:var(--color-accent-700)}
  .fx-card-img svg{width:34px;height:34px;stroke-width:1.5}
  .fx-card-txt{display:flex;flex-direction:column;justify-content:center;gap:3px;padding-right:6px}
  .fx-card-t{font-family:var(--font-heading);font-weight:600;font-size:13px;letter-spacing:.02em;text-transform:uppercase;color:var(--color-text)}
  .fx-card-m{font-size:11px;color:var(--color-mute);font-feature-settings:"tnum" 1}
  @media (max-width:760px){.fx-card{max-width:230px}.fx-card-img{width:72px;height:56px}}
  @media (max-width:760px){.fx-map{height:260px}}

  /* 01/02 — flagship ledgers (Thessa reconciliation gate, Astraea refusals).
     Same two-state pattern as the BMW figure: the .bmw-mode buttons set
     data-mode on the figure and CSS does the rest — no bespoke JS. */
  .lg-rows{border:1px solid var(--color-divider);margin-top:16px}
  .lg-row{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid color-mix(in srgb,var(--color-text) 7%,transparent);font-feature-settings:"tnum" 1}
  .lg-row:last-child{border-bottom:0}
  .lg-name{font-size:13px;line-height:1.4;color:color-mix(in srgb,var(--color-text) 82%,transparent)}
  .lg-name b{font-family:var(--font-heading);font-weight:600;font-size:13.5px;letter-spacing:.02em;color:var(--color-text)}
  .lg-sub{display:block;font-size:11px;color:var(--color-mute-2)}
  .lg-num{font-family:var(--font-heading);font-weight:600;font-size:15px;text-align:right;white-space:nowrap;color:var(--color-text)}
  .lg-tag{font-family:var(--font-heading);font-weight:600;font-size:10px;letter-spacing:.07em;text-transform:uppercase;padding:4px 9px;border:1px solid var(--color-divider);color:var(--color-mute);white-space:nowrap;min-width:104px;text-align:center}
  .lg-tag--no{border-color:var(--color-accent-700);color:var(--color-accent-700)}
  .lg-tag--ok{border-color:var(--color-accent);background:var(--color-accent-100);color:var(--color-accent-800)}
  .lg-total{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:8px 16px;border:1px solid var(--color-divider);border-top:0;padding:13px 14px}
  .lg-total-k{font-family:var(--font-heading);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-mute-2)}
  .lg-total-v{font-family:var(--font-heading);font-weight:600;font-size:20px;font-feature-settings:"tnum" 1;color:var(--color-text)}
  .lg-total-s{font-size:12px;color:var(--color-mute)}
  #cs-thessa[data-mode="naive"] .m-gate{display:none}
  #cs-thessa[data-mode="gate"] .m-naive{display:none}
  #cs-thessa[data-mode="gate"] .lg-drop .lg-name,#cs-thessa[data-mode="gate"] .lg-drop .lg-num{text-decoration:line-through;opacity:.55}
  #cs-astraea[data-mode="heuristic"] .m-gate{display:none}
  #cs-astraea[data-mode="gate"] .m-heuristic{display:none}
  #cs-astraea[data-mode="heuristic"] .lg-keep .lg-name,#cs-astraea[data-mode="heuristic"] .lg-keep .lg-num{opacity:.55}
  @media (max-width:560px){.lg-row{grid-template-columns:1fr auto;row-gap:6px}.lg-row .lg-tag{grid-column:1 / -1;justify-self:start}}
  .mc-stats.lg-stats{grid-template-columns:repeat(4,1fr)}
  @media (max-width:900px){.mc-stats.lg-stats{grid-template-columns:repeat(2,1fr)}}

  /* dark mode — bpachter.github.io aurora palette */
  [data-theme="dark"]{
    --color-bg:#0a0e14;--color-surface:#111823;--color-text:#cdd8e4;
    --color-divider:color-mix(in srgb,#cdd8e4 15%,transparent);
    /* dark clears the AA floor sooner than light — see the note on :root */
    --color-mute:color-mix(in srgb,var(--color-text) 60%,transparent);
    --color-mute-2:color-mix(in srgb,var(--color-text) 58%,transparent);
    --color-mute-3:color-mix(in srgb,var(--color-text) 56%,transparent);
    --color-accent:#2dd4bf;--color-accent-100:color-mix(in srgb,#2dd4bf 14%,transparent);
    --color-accent-600:#45e6d1;--color-accent-700:#4fdecb;--color-accent-800:#9bf0e4;
  }
  [data-theme="dark"] :is(.cs-title,.bmw-title,.fx-score){color:#eef4fb}
  [data-theme="dark"] .cs-aurora .b1{animation:drift1 22s var(--ease-out) infinite alternate}
  [data-theme="dark"] .cs-aurora .b2{animation:drift2 27s ease-in-out infinite alternate}
  [data-theme="dark"] .cs-aurora .b3{animation:drift3 31s ease-in-out infinite alternate}
  [data-theme="dark"] .theme-toggle .ic-sun{display:block}
  [data-theme="dark"] .theme-toggle .ic-moon{display:none}
  @keyframes drift1{to{transform:translate(60px,40px) scale(1.16)}}
  @keyframes drift2{to{transform:translate(-56px,30px) scale(1.12)}}
  @keyframes drift3{to{transform:translate(30px,54px) scale(1.2)}}

  /* motion */
  @keyframes fade{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .fade{animation:fade .8s var(--ease-out) both;animation-delay:calc(var(--i,0)*.07s)}
  body.motion .reveal{opacity:0;transform:translateY(18px)}
  body.motion .reveal.in{opacity:1;transform:none;transition:opacity .6s var(--ease-out),transform .6s var(--ease-out)}
  @media (prefers-reduced-motion:reduce){.fade{animation:none}body.motion .reveal{opacity:1;transform:none}.cs-aurora .blob{animation:none}}
</style>

<body>

<div class="cs">
  <div class="cs-aurora" aria-hidden="true"><span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span></div>

  <header class="cs-top">
    <a class="cs-back" href="index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" style="width:15px;height:15px;stroke-width:1.6"><path d="M15 18l-6-6 6-6"/></svg>Benjamin Pachter</a>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    </button>
  </header>

  <div class="cs-body">
    <div class="wrap">
      <section class="cs-intro">
        <span class="kick fade">Case studies</span>
        <h1 class="cs-title fade" style="--i:1">Scenarios &amp; work, in depth</h1>
        <p class="cs-lead fade" style="--i:2">A few problems worth walking through — the constraint, the redesign, and what it saved. Everything here runs live: toggle it, drag it, break it.</p>
      </section>

      <figure class="bmw blueprint reveal" data-mode="legacy" id="cs-deloitte" data-seq="01">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <figcaption class="bmw-head">
          <div>
            <span class="kick">01 · Deloitte · fixed income</span>
            <h2 class="bmw-title">Volatility regimes</h2>
          </div>
        </figcaption>
        <div class="mc">
          <canvas class="mc-canvas" id="mcCanvas" role="img" aria-label="Regime-switching Monte Carlo simulation with hidden Markov filter"></canvas>
          <div class="mc-ctrl">
            <div class="fx-presets">
              <button type="button" class="fx-preset" id="mcPlay" aria-pressed="false">Play world</button>
              <button type="button" class="fx-preset" id="mcResim">Resimulate</button>
              <button type="button" class="fx-preset" id="mcShock">Inject vol shock</button>
              <button type="button" class="fx-preset" id="mcReveal" aria-pressed="false">Reveal true regimes</button>
            </div>
            <div class="fx-presets" role="group" aria-label="MC engine">
              <button type="button" class="fx-preset fx-eng" data-e="regime" aria-pressed="true">Regime MC</button>
              <button type="button" class="fx-preset fx-eng" data-e="gbm" aria-pressed="false">Pure GBM</button>
            </div>
            <label class="mc-lab">Paths <input class="fx-val" id="mcN" type="range" min="100" max="1000" step="50" value="400"> <b id="mcNv">400</b></label>
            <label class="mc-lab">Horizon <input class="fx-val" id="mcH" type="range" min="20" max="120" step="5" value="60"> <b id="mcHv">60d</b></label>
          </div>
          <div class="mc-stats">
            <div class="mc-stat"><span class="mc-k">P(stressed) · filtered</span><span class="mc-v" id="mcPs">—</span></div>
            <div class="mc-stat"><span class="mc-k">Realized σ · 20d ann.</span><span class="mc-v" id="mcSig">—</span></div>
            <div class="mc-stat"><span class="mc-k">Median · horizon</span><span class="mc-v" id="mcMed">—</span></div>
            <div class="mc-stat"><span class="mc-k">90% band · horizon</span><span class="mc-v" id="mcBand">—</span></div>
            <div class="mc-stat"><span class="mc-k">CVaR 5% · horizon</span><span class="mc-v" id="mcCvar">—</span></div>
            <div class="mc-stat"><span class="mc-k">Filter hit-rate · window</span><span class="mc-v" id="mcAcc">—</span></div>
          </div>
        </div>
        <p class="ro-note">Under the hood: a <b>two-state hidden Markov model</b> (calm / stressed) drives returns; a forward filter infers P(stressed) from returns alone — the solid ribbon — while the dashed line is the <b>forward–backward smoother</b>, hindsight's answer. A <b>regime-switching Monte Carlo</b> fans futures out of today's filtered belief rather than a single σ, with the terminal distribution stacked at the cone's edge. Each regime is <b>geometric Brownian motion</b> — dS/S = μ dt + σ dW — the hidden chain just decides which (μ, σ) drives the diffusion; flip to <b>Pure GBM</b> to watch a single Brownian world thin out the left tail the regimes create. <b>Play world</b> lets the days tick in live; <b>Inject vol shock</b> drops a crisis mid-stream and lets you watch the filter catch it; <b>Reveal true regimes</b> grades the filter against a world it never saw — the hit-rate cell keeps score. Descendant of the GARCH regime lens from my Deloitte fixed-income work — schematic parameters, real math.</p>
      </figure>
      <figure class="bmw blueprint reveal fx" id="cs-nymt" data-seq="02">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <figcaption class="bmw-head">
          <div>
            <span class="kick">02 · New York Mortgage Trust · 2022–24</span>
            <h2 class="bmw-title">The 10-factor lens</h2>
          </div>
        </figcaption>
        <div class="fx-map" id="fxMap" aria-label="Subject property and comparable properties map">
          <span class="fx-map-tag">Charlotte, NC · illustrative comp set</span>
          <div class="fx-card">
            <span class="fx-card-img" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M6 22V4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18Z"></path><path d="M6 12H4a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2h2"></path><path d="M18 9h2a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-2"></path><path d="M10 6h4"></path><path d="M10 10h4"></path><path d="M10 14h4"></path><path d="M10 18h4"></path></svg></span>
            <div class="fx-card-txt">
              <span class="fx-card-t">Subject property</span>
              <span class="fx-card-m">284 units · $187 / sq ft</span>
              <span class="fx-card-m">95% occupancy</span>
            </div>
          </div>
        </div>
        <div class="fx-stage">
          <div>
            <div class="fx-cols"><span>Factor</span><span>Value</span><span>0–10</span><span>Weight</span><span>%</span></div>
            <div class="fx-row"><span class="fx-label">School scores</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="8.5" aria-label="School scores value"><span class="fx-vnum">8.5</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="3" aria-label="School scores weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">Crime (safety)</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="8" aria-label="Crime safety value"><span class="fx-vnum">8.0</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="3" aria-label="Crime safety weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">Comp prices</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="7.5" aria-label="Comp prices value"><span class="fx-vnum">7.5</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="2" aria-label="Comp prices weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">Rent growth YoY</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="8" aria-label="Rent growth value"><span class="fx-vnum">8.0</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="3.5" aria-label="Rent growth weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">SFH prices YoY</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="7.5" aria-label="SFH prices value"><span class="fx-vnum">7.5</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="2.5" aria-label="SFH prices weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">Census growth</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="8.5" aria-label="Census growth value"><span class="fx-vnum">8.5</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="3" aria-label="Census growth weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">Wealth demographics</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="7.5" aria-label="Wealth demographics value"><span class="fx-vnum">7.5</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="2" aria-label="Wealth demographics weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">Worker proximity</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="8" aria-label="Worker proximity value"><span class="fx-vnum">8.0</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="2" aria-label="Worker proximity weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">Occupancy</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="9" aria-label="Occupancy value"><span class="fx-vnum">9.0</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="3" aria-label="Occupancy weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
            <div class="fx-row"><span class="fx-label">$ / sq ft · units</span><input class="fx-val" type="range" min="0" max="10" step="0.1" value="7" aria-label="Price per square foot value"><span class="fx-vnum">7.0</span><input class="fx-wt" type="range" min="0" max="5" step="0.1" value="2.5" aria-label="Price per square foot weight"><span class="fx-wnum">10%</span><span class="fx-bar"><i></i></span></div>
          </div>
          <div class="fx-board">
            <div class="fx-score-row"><span class="fx-score">0.0</span><span class="fx-of">/ 10</span><span class="fx-verdict" data-v="">—</span></div>
            <div>
              <div class="fx-gauge"><i></i><span class="fx-tick" style="left:45%"></span><span class="fx-tick" style="left:70%"></span></div>
              <div class="fx-scale"><span>0</span><span>Pass · Watch · Pursue</span><span>10</span></div>
            </div>
            <div>
              <span class="fx-cap">Example deals</span>
              <div class="fx-presets">
                <button type="button" class="fx-preset" data-p="strong">Strong deal</button>
                <button type="button" class="fx-preset" data-p="marginal">Marginal</button>
                <button type="button" class="fx-preset" data-p="weak">Weak</button>
              </div>
            </div>
            <div>
              <span class="fx-cap">Weights</span>
              <div class="fx-presets" role="group" aria-label="Weights mode">
                <button type="button" class="fx-preset fx-wmode" data-w="model" aria-pressed="true">Model</button>
                <button type="button" class="fx-preset fx-wmode" data-w="equal" aria-pressed="false">Equal</button>
                <button type="button" class="fx-preset fx-wmode" data-w="custom" aria-pressed="false">Custom</button>
              </div>
            </div>
            <p class="fx-hint">Drag — or just click along — a factor track to score a deal. Weights ship locked to the model's calibration — flip to <em>Custom</em> to tune them yourself (they self-normalize to 100%). Every input is oriented so higher = better; the accent bar under each row is that factor's contribution.</p>
          </div>
        </div>
        <p class="ro-note">A public rebuild of the multi-factor acquisition screen I built at NYMT — a Fama-French-style composite over school &amp; crime scores, comps, rent and single-family momentum, census growth, wealth demographics, worker proximity, and multifamily fundamentals. Illustrative calibration, not the desk's; the original supported underwriting across a <b>$7B+</b> residential portfolio.</p>
      </figure>
      <figure class="bmw blueprint reveal" data-mode="legacy" id="cs-bmw" data-seq="03">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <figcaption class="bmw-head">
          <div>
            <span class="kick">03 · BMW Spartanburg · 2018</span>
            <h2 class="bmw-title">The line never stops</h2>
          </div>
          <div class="bmw-seg" role="group" aria-label="View mode">
            <button type="button" class="bmw-mode" data-mode="legacy" aria-pressed="true">Legacy</button>
            <button type="button" class="bmw-mode" data-mode="optimized" aria-pressed="false">Optimized</button>
          </div>
        </figcaption>
        <svg class="alt-svg" viewBox="0 0 920 320" role="img" aria-label="Production line and dock diagram">
          <defs>
            <g id="csCar">

      <figure class="bmw blueprint reveal" data-mode="naive" id="cs-thessa" data-seq="04">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <figcaption class="bmw-head">
          <div>
            <span class="kick">04 · Thessa · thessa.space</span>
            <h2 class="bmw-title">The wrong number that looks right</h2>
          </div>
          <div class="bmw-seg" role="group" aria-label="Publish mode">
            <button type="button" class="bmw-mode" data-mode="naive" aria-pressed="true">Sum the tags</button>
            <button type="button" class="bmw-mode" data-mode="gate" aria-pressed="false">Reconcile, then publish</button>
          </div>
        </figcaption>
        <p class="ro-note"><a href="https://thessa.space" target="_blank" rel="noopener">Thessa</a> maps who depends on whom across space, defense, AI infrastructure and critical minerals — a knowledge graph built from primary public records, free and open source. The hard part is not the graph, it is deciding what deserves to be in it: a filing-derived edge carries an audited dollar figure, a press release carries an assertion, and they sit on different trust rungs. The gate below is the reason the dollars can be trusted. These are <b>real numbers from Intel's FY2025 filing</b>, exactly as tagged in XBRL. Sum what the filing tags and you publish +126% — a figure that looks perfectly reasonable. Toggle the mode.</p>
        <div class="lg-rows" role="table" aria-label="Intel FY2025 segment revenue members as tagged, USD millions">
          <div class="lg-row lg-drop">
            <span class="lg-name"><b>A rollup member, tagged alongside its own children</b><span class="lg-sub">equals Client Computing + Data Center &amp; AI, to the dollar</span></span>
            <span class="lg-num">49,147</span>
            <span class="lg-tag m-naive">counted</span>
            <span class="lg-tag lg-tag--no m-gate">undetected_rollup · dropped</span>
          </div>
          <div class="lg-row">
            <span class="lg-name"><b>Client Computing Group</b></span>
            <span class="lg-num">32,228</span>
            <span class="lg-tag m-naive">counted</span>
            <span class="lg-tag m-gate">kept</span>
          </div>
          <div class="lg-row">
            <span class="lg-name"><b>Data Center &amp; AI</b></span>
            <span class="lg-num">16,919</span>
            <span class="lg-tag m-naive">counted</span>
            <span class="lg-tag m-gate">kept</span>
          </div>
          <div class="lg-row">
            <span class="lg-name"><b>Every other segment member</b><span class="lg-sub">reported gross of intersegment sales</span></span>
            <span class="lg-num">21,389</span>
            <span class="lg-tag m-naive">counted</span>
            <span class="lg-tag m-gate">kept</span>
          </div>
          <div class="lg-row">
            <span class="lg-name"><b>Intersegment elimination</b><span class="lg-sub">the filing's own reconciling row</span></span>
            <span class="lg-num">−17,683</span>
            <span class="lg-tag m-naive">ignored</span>
            <span class="lg-tag lg-tag--ok m-gate">applied</span>
          </div>
          <div class="lg-row">
            <span class="lg-name"><b>Consolidated revenue, same filing</b><span class="lg-sub">the number the sum must tie to</span></span>
            <span class="lg-num">52,853</span>
            <span class="lg-tag m-naive">not checked</span>
            <span class="lg-tag lg-tag--ok m-gate">the anchor</span>
          </div>
        </div>
        <div class="lg-total">
          <span class="m-naive"><span class="lg-total-k">Published</span>&ensp;<span class="lg-total-v">$119,683M</span>&ensp;<span class="lg-total-s">+126% against reality — and nothing downstream can tell</span></span>
          <span class="m-gate"><span class="lg-total-k">Published</span>&ensp;<span class="lg-total-v">$52,853M</span>&ensp;<span class="lg-total-s">ties to consolidated · verdict: <b>pass</b></span></span>
        </div>
        <p class="ro-note">The rollup is caught <b>arithmetically</b> — a genuine rollup ties to its children to the dollar, so no vocabulary list is needed — and both readings of the members (gross of intersegment sales vs net) are tested against the filing's own consolidated figure. Every failure gets a named class: <b>undetected_rollup</b>, <b>duplicate_facts</b>, <b>no_consolidated</b>, <b>unreconciled</b> — never "failed". Apple's product bucket is tagged above iPhone, Mac and iPad the same way; summing it publishes 2×. The rule that fell out of shipping those wrong numbers: <b>nothing publishes unless it reconciles</b>. The cost is coverage — 33% of the cohort published correctly instead of 100% plausibly — and that trade is the product.</p>
        <div class="mc-stats lg-stats">
          <div class="mc-stat"><span class="mc-k">Federal awards mapped</span><span class="mc-v">$1.98T</span></div>
          <div class="mc-stat"><span class="mc-k">Resolve to a graph recipient</span><span class="mc-v">97.5%</span></div>
          <div class="mc-stat"><span class="mc-k">Filing-derived edges · top trust rung</span><span class="mc-v">1,504</span></div>
          <div class="mc-stat"><span class="mc-k">Verified share, after one audit write-back</span><span class="mc-v">62.8 → 71.5%</span></div>
        </div>
        <p class="ro-note">The same honesty applies to the graph's own opinion of itself: an audit found the stored confidence number <b>inverted</b> — the 0.95+ band was less accurate than the band below it — so confidence was replaced with trust tiers derived from how each edge was made, and 671 audit verdicts were written back with refuted claims kept in the ledger rather than deleted. <a href="https://thessa.space" target="_blank" rel="noopener">Live</a> · <a href="https://github.com/bpachter/thessa" target="_blank" rel="noopener">Source</a> · <a href="https://github.com/bpachter/thessa/blob/main/CLAUDE.md" target="_blank" rel="noopener">The working rules</a> · <a href="graph-ontology/">How the graph is designed</a></p>

      <figure class="bmw blueprint reveal" data-mode="heuristic" id="cs-astraea" data-seq="05">
        <i class="corner tl"></i><i class="corner tr"></i><i class="corner bl"></i><i class="corner br"></i>
        <figcaption class="bmw-head">
          <div>
            <span class="kick">05 · Astraea · live on AWS</span>
            <h2 class="bmw-title">The gate that said no</h2>
          </div>
          <div class="bmw-seg" role="group" aria-label="Adjudication mode">
            <button type="button" class="bmw-mode" data-mode="heuristic" aria-pressed="true">Name-shape heuristic</button>
            <button type="button" class="bmw-mode" data-mode="gate" aria-pressed="false">Substance gate</button>
          </div>
        </figcaption>
        <p class="ro-note"><a href="https://github.com/bpachter/astraea" target="_blank" rel="noopener">Astraea</a> is the governance layer extracted from Thessa: AI agents propose facts, a typed <b>C#/.NET reconciliation gate</b> verifies them with named failure modes, and a <b>Django</b> portal makes approval structurally impossible without a passing verdict — HTTP 409, in code, not in a review comment. What follows is its <b>first live run</b> against the production graph: a heuristic had flagged twenty nodes as "article/quantifier-led phrases, not discrete entities" and proposed demoting them to generic. Toggle what each adjudicator does.</p>
        <div class="lg-rows" role="table" aria-label="Twenty proposed node demotions and their fate under each adjudicator">
          <div class="lg-row lg-keep">
            <span class="lg-name"><b>The Aerospace Corporation</b><span class="lg-sub">"The"-led phrase, said the heuristic · 213 federal contracts</span></span>
            <span class="lg-num">$9.1B</span>
            <span class="lg-tag m-heuristic">demote</span>
            <span class="lg-tag lg-tag--no m-gate">refused · substance_demotion</span>
          </div>
          <div class="lg-row lg-keep">
            <span class="lg-name"><b>Two Six Labs</b><span class="lg-sub">"Two" read as a quantifier</span></span>
            <span class="lg-num">$438M</span>
            <span class="lg-tag m-heuristic">demote</span>
            <span class="lg-tag lg-tag--no m-gate">refused</span>
          </div>
          <div class="lg-row lg-keep">
            <span class="lg-name"><b>Five Stones Research</b><span class="lg-sub">"Five" read as a quantifier</span></span>
            <span class="lg-num">$154M</span>
            <span class="lg-tag m-heuristic">demote</span>
            <span class="lg-tag lg-tag--no m-gate">refused</span>
          </div>
          <div class="lg-row lg-keep">
            <span class="lg-name"><b>Eleven more contract-holding nodes</b><span class="lg-sub">632 federal contracts across all fourteen refusals</span></span>
            <span class="lg-num">$1.2B</span>
            <span class="lg-tag m-heuristic">demote</span>
            <span class="lg-tag lg-tag--no m-gate">refused</span>
          </div>
          <div class="lg-row">
            <span class="lg-name"><b>Five name-only stubs</b><span class="lg-sub">no contracts, almost no edges</span></span>
            <span class="lg-num">—</span>
            <span class="lg-tag m-heuristic">demote</span>
            <span class="lg-tag lg-tag--ok m-gate">allowed</span>
          </div>
          <div class="lg-row">
            <span class="lg-name"><b>The MathWorks</b><span class="lg-sub">three edges, no contracts — provable neither way</span></span>
            <span class="lg-num">—</span>
            <span class="lg-tag m-heuristic">demote</span>
            <span class="lg-tag lg-tag--ok m-gate">routed to a human</span>
          </div>
        </div>
        <div class="lg-total">
          <span class="m-heuristic"><span class="lg-total-k">Outcome</span>&ensp;<span class="lg-total-v">20 demotions apply</span>&ensp;<span class="lg-total-s">$10.9B in federal contracts reclassified as "generic" — silently</span></span>
          <span class="m-gate"><span class="lg-total-k">Outcome</span>&ensp;<span class="lg-total-v">14 refused, by name</span>&ensp;<span class="lg-total-s">provenance beats name shape · a gate is a floor, not a verdict</span></span>
        </div>
        <p class="ro-note">The gate judges a node by what it <b>holds</b> — live edges, federal contracts, ticker and identity bridges — never by how its name reads. Its honest boundary is on display too: the six nodes it let through hold nothing worth protecting, and the one judgment call goes to the human reviewer it feeds. The same invariance shows up when the proposer changes: two different frontier models ran the same four filings and disagreed almost perfectly on which reconciled — swapping the proposer is one environment variable, and the verdict logic never moves. The AI is load-bearing for throughput, never for truth.</p>
        <div class="mc-stats lg-stats">
          <div class="mc-stat"><span class="mc-k">Protected on the first live run</span><span class="mc-v">$10.9B</span></div>
          <div class="mc-stat"><span class="mc-k">Approval without a verdict</span><span class="mc-v">HTTP 409</span></div>
          <div class="mc-stat"><span class="mc-k">Human outcomes calibrating AI confidence</span><span class="mc-v">1,691</span></div>
          <div class="mc-stat"><span class="mc-k">The whole AWS footprint, per month</span><span class="mc-v">~$6–9</span></div>
        </div>
        <p class="ro-note">Confidence itself is treated as a claim to verify: a split-conformal table fitted on 1,691 human-adjudicated outcomes turns the AI's self-report into a measured probability — the finding so far is that the extractor is <b>under</b>confident. The same algorithm is implemented independently in C# and Python with one shared fixture pinned in both test suites, so the implementations cannot drift. <a href="https://github.com/bpachter/astraea" target="_blank" rel="noopener">Source</a> · <a href="atlas/">Recon viewer &amp; 3D atlas</a> · <a href="https://gate.thessa.space/lookup" target="_blank" rel="noopener">Lookup API</a> · <a href="https://portal.thessa.space/admin/" target="_blank" rel="noopener">Portal</a> (<code>demo / astraea-demo</code>)</p>

        <p class="ro-note">The constraint: every serious request used to earn a 2–4 week PSS/E study, and the requests never stopped coming. The call was <b>fidelity versus throughput</b> — study everything at full accuracy, or screen first with a fast linearized headroom surface and accept that a screen is slightly wrong about flows so it can be completely right about which sites are hopeless. Screening is calibrated conservative: a false positive costs one deep study; a false negative kills a viable site, so the surface errs toward sending borderline sites through. What it bought: <b>250+ GW screened, 150+ site analyses, same-day answers, ~200 engineering hours a month</b> returned to actual engineering. The production platform is proprietary — the <a href="https://bpachter.github.io/headroom/">Headroom sandbox</a> is its public, synthetic cousin: same screening math (DC power flow, PTDF, N-1), invented network, every number checkable by hand in the <a href="https://github.com/bpachter/headroom" target="_blank" rel="noopener">open test suite</a>.</p>

<script>
document.addEventListener('DOMContentLoaded', function () {
  // Theme. An explicit choice is stored and always wins; with nothing stored
  // the page follows the OS, at load via the bootstrap in <head> and live via
  // the change listener below. Setting data-theme is also what drives the
  // Leaflet basemap swap further down, through its MutationObserver.
  const root = document.documentElement;
  const mq = window.matchMedia('(prefers-color-scheme: dark)');
  const stored = () => { try { return localStorage.getItem('bp-theme'); } catch (e) { return null; } };

  // The paired <meta name="theme-color"> tags handle the follow-the-OS case on
  // their own; once the choice is explicit the OS query is the wrong question,
  // so force the matching tag to win by rewriting both media attributes.
  const metas = Array.from(document.querySelectorAll('meta[name="theme-color"]'));
  const darkMeta = metas.find((m) => /dark/.test(m.getAttribute('media') || ''));
  const lightMeta = metas.find((m) => m !== darkMeta);
  const syncMeta = (d) => {
    if (!darkMeta || !lightMeta) return;
    darkMeta.media = d ? 'all' : 'not all';
    lightMeta.media = d ? 'not all' : 'all';
  };

  const apply = (d) => {
    if (d) root.setAttribute('data-theme', 'dark'); else root.removeAttribute('data-theme');
    syncMeta(d);
  };
  apply(stored() ? stored() === 'dark' : mq.matches);

  const t = document.getElementById('themeToggle');
  if (t) t.addEventListener('click', () => {
    const d = root.getAttribute('data-theme') !== 'dark';
    apply(d);
    try { localStorage.setItem('bp-theme', d ? 'dark' : 'light'); } catch (e) {}
  });

  const onScheme = (e) => { if (!stored()) apply(e.matches); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme);
  else if (mq.addListener) mq.addListener(onScheme);

  document.querySelectorAll('.bmw').forEach((bmw) => {
    bmw.querySelectorAll('.bmw-mode').forEach((btn) => {
      btn.addEventListener('click', () => {
        bmw.setAttribute('data-mode', btn.getAttribute('data-mode'));
        bmw.querySelectorAll('.bmw-mode').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      });
    });
  });

  // 02 · NYMT 10-factor lens
  const fx = document.querySelector('.fx');
  if (fx) {
    const rows = Array.from(fx.querySelectorAll('.fx-row'));
    const scoreEl = fx.querySelector('.fx-score');
    const gauge = fx.querySelector('.fx-gauge i');
    const verdict = fx.querySelector('.fx-verdict');
    const PRESETS = {
      strong: [8.5, 8, 7.5, 8, 7.5, 8.5, 7.5, 8, 9, 7],
      marginal: [6, 5.5, 5, 5.5, 5, 6, 5.5, 6, 6.5, 5],
      weak: [3.5, 3, 4, 2.5, 3, 3.5, 4, 4.5, 5, 3],
    };
    const compute = () => {
      let sw = 0;
      const parts = rows.map((r) => {
        const v = +r.querySelector('.fx-val').value;
        const w = +r.querySelector('.fx-wt').value;
        sw += w;
        return { r, v, w };
      });
      let sum = 0;
      parts.forEach((p) => { sum += p.v * p.w; });
      const score = sw > 0 ? sum / sw : 0;
      parts.forEach((p) => {
        p.r.querySelector('.fx-vnum').textContent = p.v.toFixed(1);
        p.r.querySelector('.fx-wnum').textContent = (sw > 0 ? (p.w / sw) * 100 : 0).toFixed(0) + '%';
        p.r.querySelector('.fx-bar i').style.width = (sw > 0 ? ((p.v * p.w) / (10 * sw)) * 100 : 0) + '%';
      });
      scoreEl.textContent = score.toFixed(1);
      gauge.style.width = (score * 10) + '%';
      const v = score >= 7 ? 'Pursue' : score >= 4.5 ? 'Watch list' : 'Pass';
      verdict.textContent = v;
      verdict.setAttribute('data-v', v);
    };
    // fixed "as shipped" calibration — tiered, not equal; Custom unlocks the sliders
    const MODEL_W = [3, 3, 2, 3.5, 2.5, 3, 2, 2, 3, 2.5];
    const setWeights = (mode) => {
      if (mode === 'model') rows.forEach((r, i) => { r.querySelector('.fx-wt').value = MODEL_W[i]; });
      if (mode === 'equal') rows.forEach((r) => { r.querySelector('.fx-wt').value = 2.5; });
      const locked = mode !== 'custom';
      rows.forEach((r) => { r.querySelector('.fx-wt').disabled = locked; });
      fx.querySelectorAll('.fx-wmode').forEach((b) => b.setAttribute('aria-pressed', String(b.getAttribute('data-w') === mode)));
      compute();
    };
    fx.addEventListener('input', compute);
    fx.querySelectorAll('.fx-preset[data-p]').forEach((btn) => btn.addEventListener('click', () => {
      const p = btn.getAttribute('data-p');
      if (PRESETS[p]) rows.forEach((r, i) => { r.querySelector('.fx-val').value = PRESETS[p][i]; });
      compute();
    }));
    fx.querySelectorAll('.fx-wmode').forEach((btn) => btn.addEventListener('click', () => { setWeights(btn.getAttribute('data-w')); }));
    setWeights('model');
  }

  // 02 · comp map (Leaflet + Carto basemaps, theme-aware)
  const mapEl = document.getElementById('fxMap');
  const initMap = () => {
    if (!mapEl || mapEl.dataset.ready || typeof L === 'undefined') return;
    mapEl.dataset.ready = '1';
    const map = L.map(mapEl, { scrollWheelZoom: false, zoomControl: false });
    const tiles = (v) => L.tileLayer('https://{s}.basemaps.cartocdn.com/' + v + '/{z}/{x}/{y}{r}.png', { attribution: '&copy; OpenStreetMap &copy; CARTO', subdomains: 'abcd', maxZoom: 19 });
    const light = tiles('light_all'), dark = tiles('dark_all');
    const isDark = () => document.documentElement.getAttribute('data-theme') === 'dark';
    let cur = (isDark() ? dark : light).addTo(map);
    new MutationObserver(() => {
      const want = isDark() ? dark : light;
      if (want !== cur) { map.removeLayer(cur); cur = want.addTo(map); }
    }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    const pin = (ll, cls, tip, perm) => L.marker(ll, { icon: L.divIcon({ className: 'fx-pin-wrap', html: '<span class="fx-pin ' + cls + '"></span>', iconSize: [16, 16], iconAnchor: [8, 8] }) }).addTo(map).bindTooltip(tip, { direction: 'top', offset: [0, -10], className: 'fx-tip', permanent: !!perm });
    const subject = [35.209, -80.862];
    const comps = [
      [[35.2145, -80.876], 'Comp A · $196/sqft · 96% occ'],
      [[35.199, -80.851], 'Comp B · $172/sqft · 92% occ'],
      [[35.2225, -80.845], 'Comp C · $215/sqft · 97% occ'],
      [[35.2035, -80.8815], 'Comp D · $181/sqft · 93% occ'],
      [[35.218, -80.857], 'Comp E · $189/sqft · 94% occ'],
    ];
    comps.forEach((c) => pin(c[0], 'fx-pin--comp', c[1]));
    pin(subject, 'fx-pin--subject', 'Subject · 284 units · $187/sqft · 95% occ', true);
    map.fitBounds(L.latLngBounds([subject].concat(comps.map((c) => c[0]))).pad(0.22));
  };
  if (typeof L !== 'undefined') initMap();
  else { let tries = 0; const iv = setInterval(() => { if (typeof L !== 'undefined' || ++tries > 40) { clearInterval(iv); initMap(); } }, 250); }

  // 03 · regime-switching Monte Carlo + HMM forward filter + smoother + live world
  const mcCanvas = document.getElementById('mcCanvas');
  if (mcCanvas) {
    const MU = [0.00045, -0.0012], SIG = [0.008, 0.026];
    const TP = [[0.986, 0.014], [0.08, 0.92]];
    const T = 380;
    const randn = () => { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
    const pdf = (r, m, s) => Math.exp(-0.5 * ((r - m) / s) ** 2) / (s * 2.5066282746);
    let world, sims, reveal = false;
    let shockLeft = 0, shockFresh = false;
    let engine = 'regime';
    const filterStep = (a, r) => {
      const pr = [a[0] * TP[0][0] + a[1] * TP[1][0], a[0] * TP[0][1] + a[1] * TP[1][1]];
      const b0 = pr[0] * pdf(r, MU[0], SIG[0]), b1 = pr[1] * pdf(r, MU[1], SIG[1]);
      const z = (b0 + b1) || 1e-12;
      return [b0 / z, b1 / z];
    };
    const makeWorld = () => {
      const states = [0], rets = [], prices = [100];
      let a = [0.9, 0.1];
      const ps = [a[1]], alphaHist = [a];
      for (let t = 1; t < T; t++) {
        const prev = states[t - 1];
        const s = Math.random() < TP[prev][prev] ? prev : 1 - prev;
        states.push(s);
        const r = MU[s] + SIG[s] * randn();
        rets.push(r);
        prices.push(prices[t - 1] * Math.exp(r));
        a = filterStep(a, r);
        ps.push(a[1]); alphaHist.push(a);
      }
      world = { states, rets, prices, ps, alphaHist, alpha: a };
    };
    const step = () => {
      const prev = world.states[world.states.length - 1];
      let s;
      if (shockLeft > 0) { s = 1; shockLeft--; }
      else s = Math.random() < TP[prev][prev] ? prev : 1 - prev;
      let r = MU[s] + SIG[s] * randn();
      if (shockFresh) { r = -0.045 - Math.abs(SIG[1] * randn()); shockFresh = false; }
      world.states.push(s);
      world.rets.push(r);
      world.prices.push(world.prices[world.prices.length - 1] * Math.exp(r));
      world.alpha = filterStep(world.alpha, r);
      world.ps.push(world.alpha[1]);
      world.alphaHist.push(world.alpha);
      if (world.prices.length > 2600) {
        const cut = 1200;
        world.states = world.states.slice(cut); world.rets = world.rets.slice(cut);
        world.prices = world.prices.slice(cut); world.ps = world.ps.slice(cut);
        world.alphaHist = world.alphaHist.slice(cut);
      }
    };
    // forward–backward smoother over the visible window
    const smooth = (off, n) => {
      const out = new Array(n);
      let b = [1, 1];
      for (let k = n - 1; k >= 0; k--) {
        const a = world.alphaHist[off + k];
        const s0 = a[0] * b[0], s1 = a[1] * b[1];
        out[k] = s1 / ((s0 + s1) || 1e-12);
        if (k > 0) {
          const r = world.rets[off + k - 1];
          const e = [pdf(r, MU[0], SIG[0]) * b[0], pdf(r, MU[1], SIG[1]) * b[1]];
          b = [TP[0][0] * e[0] + TP[0][1] * e[1], TP[1][0] * e[0] + TP[1][1] * e[1]];
          const z = (b[0] + b[1]) || 1e-12;
          b = [b[0] / z, b[1] / z];
        }
      }
      return out;
    };
    const q = (arr, f) => { const i = f * (arr.length - 1), lo = Math.floor(i); return arr[lo] + (arr[Math.min(lo + 1, arr.length - 1)] - arr[lo]) * (i - lo); };
    const runMC = () => {
      const N = +document.getElementById('mcN').value, H = +document.getElementById('mcH').value;
      const p0 = world.prices[world.prices.length - 1];
      // single-regime GBM calibration: MLE mu/sigma over the visible window
      const wr = world.rets.slice(-(T - 1));
      const gm = wr.reduce((a, b) => a + b, 0) / wr.length;
      const gs = Math.sqrt(wr.reduce((a, b) => a + (b - gm) ** 2, 0) / wr.length);
      const paths = [];
      for (let n = 0; n < N; n++) {
        let s = Math.random() < world.alpha[1] ? 1 : 0, p = p0;
        const row = [p];
        for (let k = 0; k < H; k++) {
          if (engine === 'gbm') p *= Math.exp(gm + gs * randn());
          else { s = Math.random() < TP[s][s] ? s : 1 - s; p *= Math.exp(MU[s] + SIG[s] * randn()); }
          row.push(p);
        }
        paths.push(row);
      }
      const bands = [];
      for (let k = 0; k <= H; k++) {
        const col = paths.map((r) => r[k]).sort((x, y) => x - y);
        bands.push([q(col, 0.05), q(col, 0.25), q(col, 0.5), q(col, 0.75), q(col, 0.95)]);
      }
      sims = { paths, bands, H, N, p0 };
    };
    const cssVar = (n, fb) => (getComputedStyle(document.documentElement).getPropertyValue(n) || fb).trim();
    const draw = () => {
      const dpr = window.devicePixelRatio || 1, W = mcCanvas.clientWidth, Hc = mcCanvas.clientHeight;
      if (!W || !Hc) return;
      mcCanvas.width = W * dpr; mcCanvas.height = Hc * dpr;
      const ctx = mcCanvas.getContext('2d');
      ctx.scale(dpr, dpr);
      const ink = cssVar('--color-text', '#1d1f20'), acc = cssVar('--color-accent', '#5980a6'), acc7 = cssVar('--color-accent-700', '#3f6285');
      const off = world.prices.length - T;
      const pricesW = world.prices.slice(off), psW = world.ps.slice(off), statesW = world.states.slice(off);
      const smW = smooth(off, T);
      const L = 46, R = 66, TOP = 16, RH = 56, GAP = 30, BOT = 6;
      const ch = Hc - TOP - RH - GAP - BOT;
      const total = T + sims.H;
      const X = (i) => L + (W - L - R) * (i / (total - 1));
      let mn = Infinity, mx = -Infinity;
      pricesW.forEach((p) => { if (p < mn) mn = p; if (p > mx) mx = p; });
      sims.bands.forEach((b) => { if (b[0] < mn) mn = b[0]; if (b[4] > mx) mx = b[4]; });
      const pad = (mx - mn) * 0.06; mn -= pad; mx += pad;
      const Y = (p) => TOP + ch - ((p - mn) / (mx - mn)) * ch;
      const rTop = TOP + ch + GAP;
      if (reveal) {
        ctx.fillStyle = acc; ctx.globalAlpha = 0.08;
        let runStart = -1;
        for (let t = 0; t <= T; t++) {
          const st = t < T ? statesW[t] : 0;
          if (st === 1 && runStart < 0) runStart = t;
          if (st !== 1 && runStart >= 0) {
            const x0 = X(runStart), x1 = X(t);
            ctx.fillRect(x0, TOP, x1 - x0, ch);
            ctx.fillRect(x0, rTop, x1 - x0, RH);
            runStart = -1;
          }
        }
        ctx.globalAlpha = 1;
      }
      ctx.strokeStyle = ink; ctx.globalAlpha = 0.14; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(L, TOP + ch); ctx.lineTo(W - R, TOP + ch); ctx.stroke();
      ctx.globalAlpha = 1;
      ctx.fillStyle = ink; ctx.globalAlpha = 0.5; ctx.font = '10px Barlow, sans-serif';
      ctx.fillText(String(Math.round(mx)), 10, TOP + 9);
      ctx.fillText(String(Math.round(mn)), 10, TOP + ch);
      ctx.globalAlpha = 1;
      const xT = X(T - 1);
      ctx.strokeStyle = ink; ctx.globalAlpha = 0.35; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(xT, TOP); ctx.lineTo(xT, rTop + RH); ctx.stroke();
      ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.fillStyle = ink; ctx.globalAlpha = 0.55; ctx.font = '600 10px "Barlow Condensed", sans-serif';
      ctx.fillText('TODAY', xT - 15, TOP - 4);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = acc; ctx.lineWidth = 1;
      const show = Math.min(sims.paths.length, 140);
      ctx.globalAlpha = 0.05;
      for (let n = 0; n < show; n++) {
        ctx.beginPath();
        sims.paths[n].forEach((p, k) => { const x = X(T - 1 + k), y = Y(p); if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        ctx.stroke();
      }
      ctx.globalAlpha = 1;
      const band = (loI, hiI, alpha) => {
        ctx.fillStyle = acc; ctx.globalAlpha = alpha; ctx.beginPath();
        sims.bands.forEach((b, k) => { const x = X(T - 1 + k), y = Y(b[hiI]); if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
        for (let k = sims.bands.length - 1; k >= 0; k--) ctx.lineTo(X(T - 1 + k), Y(sims.bands[k][loI]));
        ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
      };
      band(0, 4, 0.10); band(1, 3, 0.16);
      ctx.strokeStyle = acc7; ctx.lineWidth = 1.5; ctx.beginPath();
      sims.bands.forEach((b, k) => { const x = X(T - 1 + k), y = Y(b[2]); if (k) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.stroke();
      // terminal distribution histogram along the right edge
      const term = sims.paths.map((r) => r[r.length - 1]);
      const BINS = 26, bins = new Array(BINS).fill(0);
      term.forEach((p) => { let bi = Math.floor((p - mn) / (mx - mn) * BINS); if (bi < 0) bi = 0; if (bi >= BINS) bi = BINS - 1; bins[bi]++; });
      const bmax = Math.max.apply(null, bins) || 1;
      ctx.fillStyle = acc; ctx.globalAlpha = 0.42;
      for (let i = 0; i < BINS; i++) {
        const y1 = Y(mn + ((i + 1) / BINS) * (mx - mn)), y0 = Y(mn + (i / BINS) * (mx - mn));
        const bw = (R - 24) * (bins[i] / bmax);
        if (bins[i]) ctx.fillRect(W - R + 6, y1, bw, Math.max(1, y0 - y1 - 1));
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = ink; ctx.globalAlpha = 0.5; ctx.font = '600 9px "Barlow Condensed", sans-serif';
      ctx.fillText('P(T)', W - R + 6, TOP + 8);
      ctx.globalAlpha = 1;
      ctx.fillStyle = ink; ctx.globalAlpha = 0.55; ctx.font = '600 9.5px "Barlow Condensed", sans-serif';
      ctx.fillText(engine === 'gbm' ? 'MC — PURE GBM · dS/S = μ dt + σ dW' : 'MC — REGIME-SWITCHING GBM · (μ,σ) PICKED BY THE HIDDEN CHAIN', L + 8, TOP + 8);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = ink; ctx.globalAlpha = 0.8; ctx.lineWidth = 1.5; ctx.beginPath();
      pricesW.forEach((p, t) => { const x = X(t), y = Y(p); if (t) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.stroke(); ctx.globalAlpha = 1;
      // ribbon: filtered (fill + solid) and smoothed (dashed)
      ctx.strokeStyle = ink; ctx.globalAlpha = 0.25;
      ctx.strokeRect(L, rTop, W - L - R, RH);
      ctx.globalAlpha = 1;
      ctx.fillStyle = acc; ctx.globalAlpha = 0.3; ctx.beginPath();
      ctx.moveTo(X(0), rTop + RH);
      psW.forEach((p, t) => { ctx.lineTo(X(t), rTop + RH - p * RH); });
      ctx.lineTo(X(psW.length - 1), rTop + RH);
      ctx.closePath(); ctx.fill(); ctx.globalAlpha = 1;
      ctx.strokeStyle = acc7; ctx.lineWidth = 1.2; ctx.beginPath();
      psW.forEach((p, t) => { const x = X(t), y = rTop + RH - p * RH; if (t) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.stroke();
      ctx.setLineDash([3, 3]); ctx.globalAlpha = 0.75; ctx.beginPath();
      smW.forEach((p, t) => { const x = X(t), y = rTop + RH - p * RH; if (t) ctx.lineTo(x, y); else ctx.moveTo(x, y); });
      ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      ctx.fillStyle = ink; ctx.globalAlpha = 0.5; ctx.font = '600 9.5px "Barlow Condensed", sans-serif';
      ctx.fillText('P(STRESSED) — FILTERED (SOLID) · FWD–BWD SMOOTHED (DASHED)', L + 7, rTop + 13);
      ctx.globalAlpha = 1;
    };
    const fmtPct = (x) => (x >= 0 ? '+' : '') + (x * 100).toFixed(1) + '%';
    const stats = () => {
      const off = world.prices.length - T;
      const psW = world.ps.slice(off), stW = world.states.slice(off);
      document.getElementById('mcPs').textContent = (psW[psW.length - 1] * 100).toFixed(0) + '%';
      const last = world.rets.slice(-20);
      const m = last.reduce((a, b) => a + b, 0) / last.length;
      const sd = Math.sqrt(last.reduce((a, b) => a + (b - m) ** 2, 0) / last.length) * Math.sqrt(252);
      document.getElementById('mcSig').textContent = (sd * 100).toFixed(1) + '%';
      const tb = sims.bands[sims.bands.length - 1];
      document.getElementById('mcMed').textContent = fmtPct(tb[2] / sims.p0 - 1);
      document.getElementById('mcBand').textContent = fmtPct(tb[0] / sims.p0 - 1) + ' … ' + fmtPct(tb[4] / sims.p0 - 1);
      const term = sims.paths.map((r) => r[r.length - 1]).sort((x, y) => x - y);
      const k = Math.max(1, Math.ceil(term.length * 0.05));
      let cv = 0; for (let i = 0; i < k; i++) cv += term[i];
      document.getElementById('mcCvar').textContent = fmtPct((cv / k) / sims.p0 - 1);
      let hit = 0;
      for (let i = 0; i < psW.length; i++) if ((psW[i] > 0.5 ? 1 : 0) === stW[i]) hit++;
      document.getElementById('mcAcc').textContent = ((hit / psW.length) * 100).toFixed(0) + '%';
    };
    const rerun = () => { runMC(); draw(); stats(); };
    makeWorld();
    rerun();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => draw());
    let timer = null;
    const playBtn = document.getElementById('mcPlay');
    playBtn.addEventListener('click', () => {
      if (timer) { clearInterval(timer); timer = null; playBtn.textContent = 'Play world'; playBtn.setAttribute('aria-pressed', 'false'); }
      else { timer = setInterval(() => { step(); rerun(); }, 110); playBtn.textContent = 'Pause'; playBtn.setAttribute('aria-pressed', 'true'); }
    });
    document.getElementById('mcResim').addEventListener('click', () => { shockLeft = 0; shockFresh = false; makeWorld(); rerun(); });
    document.getElementById('mcShock').addEventListener('click', () => {
      shockLeft = 12; shockFresh = true;
      if (!timer) { for (let i = 0; i < 14; i++) step(); rerun(); }
    });
    document.querySelectorAll('.fx-eng').forEach((btn) => btn.addEventListener('click', () => {
      engine = btn.getAttribute('data-e');
      document.querySelectorAll('.fx-eng').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
      rerun();
    }));
    document.getElementById('mcReveal').addEventListener('click', (e) => { reveal = !reveal; e.currentTarget.setAttribute('aria-pressed', String(reveal)); draw(); });
    document.getElementById('mcN').addEventListener('input', () => { document.getElementById('mcNv').textContent = document.getElementById('mcN').value; rerun(); });
    document.getElementById('mcH').addEventListener('input', () => { document.getElementById('mcHv').textContent = document.getElementById('mcH').value + 'd'; rerun(); });
    new MutationObserver(() => draw()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
    if ('ResizeObserver' in window) new ResizeObserver(() => draw()).observe(mcCanvas);
  }

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
  if (!reduce && 'IntersectionObserver' in window) {
    document.body.classList.add('motion');
    let fired = false;
    const ro = new IntersectionObserver((es) => {
      fired = true;
      es.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in'); ro.unobserve(e.target); } });
    }, { rootMargin: '0px 0px -10% 0px', threshold: 0.08 });
    document.querySelectorAll('.reveal').forEach((el) => ro.observe(el));
    setTimeout(() => { if (!fired) document.querySelectorAll('.reveal').forEach((el) => el.classList.add('in')); }, 1500);
  }
});
</script>
</body>
</html>
