name: Deploy GitHub Pages Site

# Single source of truth for the bpachter.github.io portfolio.
# Publishes ONLY what's in this repo — index.html (+ optional assets/)
# plus self-contained project subpaths like gradient/ —
# via the official GitHub Pages Actions deploy.
# Requires Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'gradient/**'
      - '.github/workflows/deploy-pages-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          if [ -d assets ]; then cp -r assets _site/assets; fi
          if [ -d gradient ]; then cp -r gradient _site/gradient; fi
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
