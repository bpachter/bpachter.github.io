name: Deploy GitHub Pages Site

# Single source of truth for the bpachter.github.io portfolio.
# Publishes ONLY what's in this repo — index.html (+ optional assets/)
# plus self-contained project subpaths like gradient/ —
# via the official GitHub Pages Actions deploy.
# Requires Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    # Anything servable MUST appear both here and in "Assemble Pages artifact"
    # below. A directory missing from the copy step is not merely un-deployed:
    # the assemble step starts with `rm -rf _site`, so the next deploy triggered
    # by ANY other path silently deletes it from the live site. astraea/,
    # updraft/ and media/ were absent from both lists and went 404 that way.
    paths:
      - 'index.html'
      - 'case-studies.html'
      - 'BPachterResume.pdf'
      - 'assets/**'
      - 'media/**'
      - 'astraea/**'
      - 'gradient/**'
      - 'attractor/**'
      - 'drawdown/**'
      - 'kernel/**'
      - 'updraft/**'
      - '.github/workflows/deploy-pages-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Gradient + Attractor (TypeScript → per-page bundles)
        run: |
          npm install -g typescript@5.6.3
          bash gradient/build.sh
          bash attractor/build.sh

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f case-studies.html ]; then cp case-studies.html _site/case-studies.html; fi
          if [ -f BPachterResume.pdf ]; then cp BPachterResume.pdf _site/BPachterResume.pdf; fi
          if [ -d assets ]; then cp -r assets _site/assets; fi
          if [ -d media ]; then cp -r media _site/media; fi
          # Vite build output — no src/ or build script to strip.
          if [ -d astraea ]; then cp -r astraea _site/astraea; fi
          if [ -d gradient ]; then
            cp -r gradient _site/gradient
            rm -rf _site/gradient/src _site/gradient/build.sh _site/gradient/.gitignore _site/gradient/ROADMAP.md
          fi
          if [ -d attractor ]; then
            cp -r attractor _site/attractor
            rm -rf _site/attractor/src _site/attractor/build.sh _site/attractor/ROADMAP.md
          fi
          if [ -d drawdown ]; then cp -r drawdown _site/drawdown; fi
          if [ -d kernel ]; then cp -r kernel _site/kernel; fi
          if [ -d updraft ]; then cp -r updraft _site/updraft; fi
          touch _site/.nojekyll

          # Fail the build rather than publish a site missing an app the
          # portfolio links to. This is the check that would have caught
          # astraea/ and updraft/ going 404 instead of shipping it.
          missing=0
          for d in astraea attractor drawdown gradient kernel updraft media; do
            if [ -d "$d" ] && [ ! -e "_site/$d" ]; then
              echo "::error::$d is tracked but was not copied into _site"
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
