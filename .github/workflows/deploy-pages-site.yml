name: Deploy GitHub Pages Site

# Single source of truth for the bpachter.github.io portfolio.
# Publishes ONLY what's in this repo — index.html (+ optional assets/)
# plus self-contained project subpaths like gradient/ —
# via the official GitHub Pages Actions deploy.
# Requires Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'case-studies.html'
      - 'BPachterResume.pdf'
      - 'assets/**'
      - 'gradient/**'
      - 'attractor/**'
      - 'drawdown/**'
      - 'kernel/**'
      - '.github/workflows/deploy-pages-site.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Gradient + Attractor (TypeScript → per-page bundles)
        run: |
          npm install -g typescript@5.6.3
          bash gradient/build.sh
          bash attractor/build.sh

      - name: Assemble Pages artifact
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html _site/index.html
          if [ -f case-studies.html ]; then cp case-studies.html _site/case-studies.html; fi
          if [ -f BPachterResume.pdf ]; then cp BPachterResume.pdf _site/BPachterResume.pdf; fi
          if [ -d assets ]; then cp -r assets _site/assets; fi
          if [ -d gradient ]; then
            cp -r gradient _site/gradient
            rm -rf _site/gradient/src _site/gradient/build.sh _site/gradient/.gitignore _site/gradient/ROADMAP.md
          fi
          if [ -d attractor ]; then
            cp -r attractor _site/attractor
            rm -rf _site/attractor/src _site/attractor/build.sh _site/attractor/ROADMAP.md
          fi
          if [ -d drawdown ]; then cp -r drawdown _site/drawdown; fi
          if [ -d kernel ]; then cp -r kernel _site/kernel; fi
          touch _site/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
